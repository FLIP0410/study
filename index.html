<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공부 플래너</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 16px;
      color: #f3f4f6;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0b1020, #17132d 60%, #102333);
    }

    .app {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    header p {
      margin: 0;
      color: #b7bfd3;
    }

    .panel {
      margin-bottom: 20px;
      padding: 20px;
      border: 1px solid #343953;
      border-radius: 18px;
      background: rgba(20, 25, 45, 0.92);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
    }

    .calendar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .calendar-top h2 {
      margin: 0;
      font-size: 21px;
    }

    .calendar-buttons {
      display: flex;
      gap: 8px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: #f3f4f6;
      cursor: pointer;
    }

    .small-button {
      padding: 8px 12px;
      border: 1px solid #454c6b;
      border-radius: 10px;
      background: #252b45;
    }

    .small-button:hover {
      background: #343b5c;
    }

    .weekdays,
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }

    .weekdays {
      margin-bottom: 8px;
      color: #aeb8d0;
      text-align: center;
      font-size: 13px;
    }

    .day {
      position: relative;
      min-height: 70px;
      padding: 9px 4px;
      border: 1px solid #343953;
      border-radius: 12px;
      background: #191f36;
    }

    .day:hover {
      border-color: #9b8cff;
    }

    .day.selected {
      border: 2px solid #a78bfa;
      background: #302957;
    }

    .day.today .day-number {
      color: #67e8f9;
      font-weight: bold;
    }

    .day-number {
      display: block;
      font-size: 14px;
    }

    .day-count {
      display: inline-block;
      margin-top: 8px;
      padding: 2px 6px;
      border-radius: 20px;
      color: #d9faff;
      background: #164e63;
      font-size: 11px;
    }

    .empty-day {
      min-height: 70px;
    }

    .selected-date {
      margin: 0 0 16px;
      color: #c4b5fd;
      font-size: 18px;
    }

    form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #454c6b;
      border-radius: 10px;
      color: #f3f4f6;
      background: #101528;
    }

    input[type="text"]::placeholder {
      color: #8d96ad;
    }

    .add-button {
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      background: #7c5cff;
      font-weight: bold;
    }

    .add-button:hover {
      background: #9278ff;
    }

    ul {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid #343953;
      border-radius: 12px;
      background: #191f36;
    }

    .task label {
      display: flex;
      flex: 1;
      align-items: center;
      gap: 10px;
      overflow-wrap: anywhere;
      cursor: pointer;
    }

    .task input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #a78bfa;
      cursor: pointer;
    }

    .task.done span {
      color: #929bb0;
      text-decoration: line-through;
    }

    .delete-button {
      padding: 7px 10px;
      border: 1px solid #69404d;
      border-radius: 8px;
      color: #fecdd3;
      background: #3a202e;
    }

    .delete-button:hover {
      background: #552735;
    }

    .empty-message {
      padding: 16px 4px;
      color: #aeb8d0;
      text-align: center;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid #67e8f9;
      outline-offset: 2px;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 12px;
      }

      .panel {
        padding: 14px;
      }

      .day {
        min-height: 58px;
        padding: 7px 3px;
      }

      .empty-day {
        min-height: 58px;
      }

      .calendar,
      .weekdays {
        gap: 4px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <h1>공부 플래너 ✨</h1>
      <p>날짜를 고르고 오늘 할 공부를 적어 보세요.</p>
    </header>

    <section class="panel" aria-label="달력">
      <div class="calendar-top">
        <h2 id="month-title"></h2>
        <div class="calendar-buttons">
          <button class="small-button" id="today-button" type="button">오늘</button>
          <button class="small-button" id="previous-button" type="button" aria-label="이전 달">‹</button>
          <button class="small-button" id="next-button" type="button" aria-label="다음 달">›</button>
        </div>
      </div>

      <div class="weekdays">
        <span>월</span><span>화</span><span>수</span><span>목</span>
        <span>금</span><span>토</span><span>일</span>
      </div>
      <div class="calendar" id="calendar"></div>
    </section>

    <section class="panel">
      <h2 class="selected-date" id="selected-date"></h2>

      <form id="task-form">
        <input
          id="task-input"
          type="text"
          placeholder="예: 수학 문제 풀기"
          aria-label="공부 일정"
          autocomplete="off"
        >
        <button class="add-button" type="submit">추가</button>
      </form>

      <ul id="task-list"></ul>
    </section>
  </main>

  <script>
    const storageKey = "study-planner-tasks";

    const today = new Date();
    let selectedDate = dateKey(today);
    let shownMonth = new Date(today.getFullYear(), today.getMonth(), 1);
    let tasks = JSON.parse(localStorage.getItem(storageKey) || "[]");

    const monthTitle = document.getElementById("month-title");
    const calendar = document.getElementById("calendar");
    const selectedDateTitle = document.getElementById("selected-date");
    const taskForm = document.getElementById("task-form");
    const taskInput = document.getElementById("task-input");
    const taskList = document.getElementById("task-list");

    function dateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function saveTasks() {
      localStorage.setItem(storageKey, JSON.stringify(tasks));
    }

    function renderCalendar() {
      const year = shownMonth.getFullYear();
      const month = shownMonth.getMonth();

      monthTitle.textContent = new Intl.DateTimeFormat("ko-KR", {
        year: "numeric",
        month: "long"
      }).format(shownMonth);

      calendar.replaceChildren();

      const firstDay = new Date(year, month, 1);
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const emptySpaces = (firstDay.getDay() + 6) % 7;

      for (let i = 0; i < emptySpaces; i++) {
        const blank = document.createElement("div");
        blank.className = "empty-day";
        calendar.appendChild(blank);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        const key = dateKey(date);
        const count = tasks.filter(task => task.date === key).length;

        const button = document.createElement("button");
        button.type = "button";
        button.className = "day";
        button.setAttribute("aria-label", `${month + 1}월 ${day}일`);

        if (key === selectedDate) {
          button.classList.add("selected");
        }
        if (key === dateKey(today)) {
          button.classList.add("today");
        }

        const number = document.createElement("span");
        number.className = "day-number";
        number.textContent = day;
        button.appendChild(number);

        if (count > 0) {
          const badge = document.createElement("span");
          badge.className = "day-count";
          badge.textContent = `일정 ${count}`;
          button.appendChild(badge);
        }

        button.addEventListener("click", () => {
          selectedDate = key;
          render();
        });

        calendar.appendChild(button);
      }
    }

    function renderTasks() {
      const date = new Date(`${selectedDate}T00:00:00`);
      selectedDateTitle.textContent = new Intl.DateTimeFormat("ko-KR", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "long"
      }).format(date);

      taskList.replaceChildren();

      const todaysTasks = tasks.filter(task => task.date === selectedDate);

      if (todaysTasks.length === 0) {
        const message = document.createElement("li");
        message.className = "empty-message";
        message.textContent = "아직 일정이 없어요. 공부할 일을 추가해 보세요!";
        taskList.appendChild(message);
        return;
      }

      for (const task of todaysTasks) {
        const item = document.createElement("li");
        item.className = "task";

        if (task.done) {
          item.classList.add("done");
        }

        const label = document.createElement("label");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.setAttribute("aria-label", `${task.text} 완료`);

        const text = document.createElement("span");
        text.textContent = task.text;

        checkbox.addEventListener("change", () => {
          task.done = checkbox.checked;
          saveTasks();
          render();
        });

        label.append(checkbox, text);

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "delete-button";
        deleteButton.textContent = "삭제";
        deleteButton.setAttribute("aria-label", `${task.text} 삭제`);

        deleteButton.addEventListener("click", () => {
          tasks = tasks.filter(savedTask => savedTask.id !== task.id);
          saveTasks();
          render();
        });

        item.append(label, deleteButton);
        taskList.appendChild(item);
      }
    }

    function render() {
      renderCalendar();
      renderTasks();
    }

    taskForm.addEventListener("submit", event => {
      event.preventDefault();

      const text = taskInput.value.trim();
      if (text === "") {
        taskInput.focus();
        return;
      }

      tasks.push({
        id: `${Date.now()}-${Math.random()}`,
        text: text,
        date: selectedDate,
        done: false
      });

      saveTasks();
      taskInput.value = "";
      render();
      taskInput.focus();
    });

    document.getElementById("previous-button").addEventListener("click", () => {
      shownMonth = new Date(
        shownMonth.getFullYear(),
        shownMonth.getMonth() - 1,
        1
      );
      selectedDate = dateKey(shownMonth);
      render();
    });

    document.getElementById("next-button").addEventListener("click", () => {
      shownMonth = new Date(
        shownMonth.getFullYear(),
        shownMonth.getMonth() + 1,
        1
      );
      selectedDate = dateKey(shownMonth);
      render();
    });

    document.getElementById("today-button").addEventListener("click", () => {
      selectedDate = dateKey(today);
      shownMonth = new Date(today.getFullYear(), today.getMonth(), 1);
      render();
    });

    render();
  </script>
</body>
</html>
